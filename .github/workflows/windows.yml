name: Build NEUROCHIP Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --onefile --name NEUROCHIP-LAB3 --add-data "assets;assets" app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NEUROCHIP-LAB3-Windows
          path: dist/NEUROCHIP-LAB3.exe
